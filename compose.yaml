services:
  app:
    image: ghcr.io/marriott55/miniauth-app:v1.1.0
    container_name: miniauth-app
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MINIAUTH_PORT: "5000"
      MINIAUTH_SECRET_KEY: "miniauth-lab-insecure-secret-key-do-not-use-in-prod"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; r = urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2); sys.exit(0 if r.status == 200 else 1)"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - miniauth_net

  zap:
    image: ghcr.io/zaproxy/zaproxy:2.16.0
    container_name: miniauth-zap
    user: zap
    command: ["zap-webswing.sh"]
    ports:
      - "127.0.0.1:8080:8080"
    stdin_open: true
    tty: true
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - miniauth_net

  cucumber:
    image: ghcr.io/marriott55/miniauth-cucumber:v1.1.0
    profiles:
      - bdd
    entrypoint:
      - "sh"
      - "-c"
      - "rm -rf /workspace/target/test-classes/features && exec mvn --batch-mode -o test \"-Dcucumber.filter.tags=$${CUCUMBER_FILTER_TAGS}\""
    environment:
      MINIAUTH_TARGET_URL: "http://app:5000"
      CUCUMBER_FILTER_TAGS: "${CUCUMBER_FILTER_TAGS:-not @fallo-controlado}"
    volumes:
      - type: bind
        source: ./cucumber/src/test/resources/features/autenticacion_fallo.feature
        target: /workspace/src/test/resources/features/autenticacion_fallo.feature
        read_only: true
    depends_on:
      app:
        condition: service_healthy
    networks:
      - miniauth_net

networks:
  miniauth_net:
    name: miniauth_net
    driver: bridge
