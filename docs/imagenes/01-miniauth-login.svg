<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440">
  <defs>
    <style>
      .bg { fill: #f4f6fb; }
      .win { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .bar { fill: #e2e8f0; }
      .url { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; rx: 5; }
      .title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 12px; fill: #475569; }
      .label { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #1e293b; }
      .mono { font-family: monospace; font-size: 12px; fill: #0f172a; }
      .btn-p { fill: #1d4ed8; rx: 6; }
      .btn-s { fill: #334155; rx: 6; }
      .btn-txt { font-family: system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .badge-b { fill: #dbeafe; rx: 10; }
      .badge-b-txt { font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; fill: #1e40af; }
      .badge-g { fill: #dcfce7; rx: 10; }
      .badge-g-txt { font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; fill: #166534; }
      .callout { fill: none; stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 5,3; rx: 6; }
      .step-num { fill: #dc2626; }
      .step-txt { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
    </style>
  </defs>

  <rect width="920" height="440" class="bg"/>

  <!-- Panel Izquierdo: /login -->
  <rect x="20" y="20" width="420" height="400" class="win"/>
  <rect x="20" y="20" width="420" height="36" class="bar" rx="10"/>
  <rect x="85" y="26" width="335" height="24" class="url"/>
  <text x="95" y="42" class="mono">http://localhost:5000/login</text>

  <rect x="55" y="75" width="350" height="325" class="win"/>
  <rect x="75" y="92" width="170" height="22" class="badge-b"/>
  <text x="85" y="107" class="badge-b-txt">Laboratorio V&amp;V — Equipo 6</text>
  <text x="75" y="135" class="title">MiniAuth Lab</text>
  <text x="75" y="153" class="subtitle">Portal de autenticación DAST y BDD</text>

  <text x="75" y="182" class="label">Usuario</text>
  <rect x="75" y="188" width="310" height="30" class="url"/>
  <text x="85" y="208" class="mono">estudiante</text>

  <text x="75" y="238" class="label">Contraseña</text>
  <rect x="75" y="244" width="310" height="30" class="url"/>
  <text x="85" y="264" class="mono">Taller123!</text>

  <rect x="75" y="290" width="310" height="34" class="btn-p"/>
  <text x="185" y="312" class="btn-txt">Iniciar sesión</text>
  <rect x="70" y="285" width="320" height="44" class="callout"/>
  <circle cx="65" cy="285" r="11" class="step-num"/>
  <text x="61" y="289" class="step-txt">1</text>

  <text x="75" y="352" class="subtitle">Credenciales ficticias: estudiante / Taller123!</text>
  <text x="75" y="372" class="subtitle">Confinado a 127.0.0.1 (solo laboratorio local)</text>

  <!-- Panel Derecho: /perfil -->
  <rect x="480" y="20" width="420" height="400" class="win"/>
  <rect x="480" y="20" width="420" height="36" class="bar" rx="10"/>
  <rect x="545" y="26" width="335" height="24" class="url"/>
  <text x="555" y="42" class="mono">http://localhost:5000/perfil</text>

  <rect x="515" y="75" width="350" height="325" class="win"/>
  <rect x="535" y="92" width="105" height="22" class="badge-g"/>
  <text x="547" y="107" class="badge-g-txt">Sesión activa</text>

  <text x="535" y="138" class="title">Bienvenido, estudiante</text>
  <rect x="528" y="118" width="245" height="28" class="callout"/>
  <circle cx="523" cy="118" r="11" class="step-num"/>
  <text x="519" y="122" class="step-txt">2</text>

  <text x="535" y="162" class="subtitle">Has accedido correctamente al área protegida.</text>

  <rect x="535" y="185" width="310" height="80" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
  <text x="547" y="210" class="label">Estado de la sesión: Autenticado</text>
  <text x="547" y="232" class="subtitle">Usuario en sesión: estudiante</text>
  <text x="547" y="250" class="subtitle">Comprobado por Cucumber BDD.</text>

  <rect x="535" y="290" width="310" height="34" class="btn-s"/>
  <text x="645" y="312" class="btn-txt">Cerrar sesión</text>
  <rect x="530" y="285" width="320" height="44" class="callout"/>
  <circle cx="525" cy="285" r="11" class="step-num"/>
  <text x="521" y="289" class="step-txt">3</text>
</svg>
