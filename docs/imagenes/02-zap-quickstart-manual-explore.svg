<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460">
  <defs>
    <style>
      .bg { fill: #1e293b; }
      .win { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 8; }
      .header { fill: #334155; }
      .tab-active { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .tab-inactive { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1; }
      .title { font-family: system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .txt { font-family: system-ui, sans-serif; font-size: 13px; fill: #1e293b; }
      .mono { font-family: monospace; font-size: 13px; font-weight: bold; fill: #0f172a; }
      .btn { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; rx: 5; }
      .btn-primary { fill: #2563eb; rx: 5; }
      .btn-primary-txt { font-family: system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .callout { fill: none; stroke: #dc2626; stroke-width: 3; rx: 6; }
      .badge { fill: #dc2626; }
      .badge-txt { font-family: system-ui, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
    </style>
  </defs>

  <rect width="920" height="460" class="bg"/>

  <!-- Barra de navegador host -->
  <rect x="15" y="15" width="890" height="430" class="win"/>
  <rect x="15" y="15" width="890" height="36" class="header" rx="8"/>
  <rect x="90" y="21" width="520" height="24" fill="#ffffff" rx="4"/>
  <text x="102" y="38" class="mono">http://localhost:8080/zap</text>
  <text x="630" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">OWASP ZAP 2.16.0 (Webswing)</text>

  <!-- Panel Izquierdo: Árbol Sites -->
  <rect x="25" y="65" width="230" height="365" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="25" y="65" width="90" height="26" class="tab-active"/>
  <text x="45" y="83" class="title">Sites</text>
  <text x="40" y="115" class="txt">📁 Sites</text>

  <!-- Panel Derecho: Quick Start / Manual Explore -->
  <rect x="265" y="65" width="625" height="365" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="265" y="65" width="120" height="26" class="tab-active"/>
  <text x="280" y="83" class="title">Quick Start</text>

  <!-- Paso 1: Diálogo inicial de persistencia -->
  <rect x="285" y="105" width="585" height="72" fill="#fffbeb" stroke="#f59e0b" rx="6"/>
  <text x="300" y="128" class="title">Diálogo inicial al abrir ZAP: "¿Quiere persistir la sesión de ZAP?"</text>
  <text x="300" y="148" class="txt">Selecciona: "No, no quiero persistir esta sesión en este momento" → Clic en "Start" (Iniciar)</text>
  <rect x="280" y="100" width="595" height="82" class="callout"/>
  <circle cx="280" cy="100" r="12" class="badge"/>
  <text x="276" y="104" class="badge-txt">1</text>

  <!-- Paso 2: Botón Manual Explore -->
  <text x="290" y="210" class="title">En la pestaña Quick Start, selecciona:</text>
  <rect x="290" y="222" width="210" height="42" class="btn"/>
  <text x="315" y="248" class="title">🔍 Manual Explore</text>
  <rect x="285" y="217" width="220" height="52" class="callout"/>
  <circle cx="285" cy="217" r="12" class="badge"/>
  <text x="281" y="221" class="badge-txt">2</text>

  <!-- Paso 3: URL to explore = http://app:5000/login -->
  <text x="290" y="302" class="title">URL to explore (¡usar el nombre del servicio 'app', NO 'localhost'!):</text>
  <rect x="290" y="312" width="440" height="34" fill="#ffffff" stroke="#1e293b" stroke-width="1.5" rx="4"/>
  <text x="302" y="334" class="mono">http://app:5000/login</text>
  <rect x="285" y="307" width="450" height="44" class="callout"/>
  <circle cx="285" cy="307" r="12" class="badge"/>
  <text x="281" y="311" class="badge-txt">3</text>

  <!-- Alternativa directa Open URL / Requester -->
  <text x="290" y="382" class="txt">Nota: Si en Webswing no deseas abrir navegador embebido, usa el menú superior:</text>
  <text x="290" y="404" class="mono">Tools → Manual Request Editor... → URL: http://app:5000/login → clic en "Send"</text>
  <rect x="285" y="366" width="585" height="50" class="callout"/>
  <circle cx="285" cy="366" r="12" class="badge"/>
  <text x="281" y="370" class="badge-txt">4</text>
</svg>
